name: Daily product refresh

# A refresh spends a slice of eBay's daily call allowance across all five
# markets. It used to run after every verified deploy as well, which on a busy
# day meant nine sweeps: the allowance was gone by half past midnight and every
# market failed with "The request limit has been reached for the resource."
# Shipping code does not change what eBay is selling, so a deploy no longer
# triggers one. Run it by hand from the Actions tab when a change is meant to
# reach the catalogue before the next scheduled run.
on:
  schedule:
    # GitHub Actions cron uses UTC. This runs daily at 12:15 UTC
    # (8:15 AM New York during daylight saving time, 7:15 AM in winter).
    - cron: "15 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-product-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate admin secret
        env:
          ADMIN_KEY: ${{ secrets.ONEDEAL_ADMIN_KEY }}
        run: |
          if [ -z "${ADMIN_KEY}" ]; then
            echo "ONEDEAL_ADMIN_KEY secret is missing"
            exit 1
          fi

      - name: Wake Azure App Service
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors \
            "https://www.onedailydrop.com/api/status" \
            > /dev/null

      - name: Trigger OneDealTheDay refresh
        env:
          ADMIN_KEY: ${{ secrets.ONEDEAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "x-admin-key: ${ADMIN_KEY}" \
            "https://www.onedailydrop.com/api/admin/refresh")
          echo "Refresh response: ${response}"

          for attempt in $(seq 1 50); do
            status=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 60 \
              -H "x-admin-key: ${ADMIN_KEY}" \
              "https://www.onedailydrop.com/api/admin/refresh-status")
            state=$(STATUS_JSON="${status}" node -e 'const value=JSON.parse(process.env.STATUS_JSON); process.stdout.write(String(value.status || ""))')
            echo "Refresh status (${attempt}/50): ${state}"
            if [ "${state}" = "success" ]; then
              echo "Refresh completed: ${status}"
              exit 0
            fi
            if [ "${state}" = "failed" ]; then
              echo "Refresh failed: ${status}"
              exit 1
            fi
            sleep 30
          done

          echo "Refresh did not finish within 25 minutes"
          exit 1

      - name: Verify refreshed products
        run: |
          set -euo pipefail
          status=$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "https://www.onedailydrop.com/api/status")
          echo "Status after refresh: ${status}"
          echo "${status}" | grep -q '"products"' || {
            echo "Refresh verification failed: products field is missing"
            exit 1
          }
