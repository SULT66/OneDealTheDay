name: Daily product refresh

# Automatic catalog updates are owned by the Azure scheduler: every six
# hours per market. A second GitHub schedule would add off-cycle updates.
# Keep this workflow available only for an explicitly requested manual run.
on:
  workflow_dispatch:

concurrency:
  group: daily-product-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The primary-market source is intentionally allowed about 31 minutes
    # (its 30-minute deadline plus shutdown grace), and the remaining markets
    # are refreshed after it. The old 30-minute job / 25-minute polling window
    # could therefore report a failure while the bounded server job was still
    # working normally. This timeout covers the server's own limits; it does
    # not make any retailer request wait longer.
    timeout-minutes: 90

    steps:
      - name: Validate admin secret
        env:
          ADMIN_KEY: ${{ secrets.ONEDEAL_ADMIN_KEY }}
        run: |
          if [ -z "${ADMIN_KEY}" ]; then
            echo "ONEDEAL_ADMIN_KEY secret is missing"
            exit 1
          fi

      - name: Wake Azure App Service, and wait for it to settle
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors \
            "https://www.onedailydrop.com/api/status" \
            > /dev/null

          # Answering is not the same as being ready.
          #
          # This step used to be the whole check, and it passed on 2026-09-09
          # ten minutes after a deploy: /api/status answers in a quarter of a
          # second while page renders are still taking ten. The refresh went
          # ahead onto a single core that was still warming, and the site was
          # 503 for twenty-five minutes.
          #
          # The server refuses a refresh while it is settling and says how
          # long is left, so the honest thing to do is wait for it rather than
          # ask and be turned away. A scheduled run has all day.
          for attempt in $(seq 1 20); do
            uptime=$(curl --fail --silent --show-error --max-time 20 \
              "https://www.onedailydrop.com/api/status" | jq -r ".uptimeSeconds // 0")
            if [ "${uptime}" -ge 600 ]; then
              echo "Up for ${uptime}s — settled."
              break
            fi
            echo "Attempt ${attempt}/20: up for only ${uptime}s, waiting for it to settle."
            sleep 45
          done

      - name: Trigger OneDealTheDay refresh
        env:
          ADMIN_KEY: ${{ secrets.ONEDEAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "x-admin-key: ${ADMIN_KEY}" \
            "https://www.onedailydrop.com/api/admin/refresh")
          echo "Refresh response: ${response}"

          # Seventy minutes covers the bounded primary-market deadline and the
          # smaller markets that follow it. Polling is only observation: the
          # refresh continues on Azure and keeps its existing source deadlines.
          for attempt in $(seq 1 140); do
            status=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 60 \
              -H "x-admin-key: ${ADMIN_KEY}" \
              "https://www.onedailydrop.com/api/admin/refresh-status")
            state=$(STATUS_JSON="${status}" node -e 'const value=JSON.parse(process.env.STATUS_JSON); process.stdout.write(String(value.status || ""))')
            echo "Refresh status (${attempt}/50): ${state}"
            if [ "${state}" = "success" ]; then
              echo "Refresh completed: ${status}"
              exit 0
            fi
            if [ "${state}" = "failed" ]; then
              echo "Refresh failed: ${status}"
              exit 1
            fi
            sleep 30
          done

          echo "Refresh did not finish within 70 minutes"
          exit 1

      - name: Verify refreshed products
        run: |
          set -euo pipefail
          status=$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "https://www.onedailydrop.com/api/status")
          echo "Status after refresh: ${status}"
          echo "${status}" | grep -q '"products"' || {
            echo "Refresh verification failed: products field is missing"
            exit 1
          }
