name: Verify public coupons
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coupon-refresh.yml'
      - 'src/publicCouponDiscovery.js'
      - 'scripts/collect-public-coupons.js'
permissions:
  contents: write
concurrency:
  group: public-coupon-snapshot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Collect current codes from official merchant pages
        env:
          COUPON_OUTPUT: ${{ runner.temp }}/public-coupons.json
        run: node scripts/collect-public-coupons.js
      - name: Save verified snapshot without redeploying the storefront
        uses: actions/github-script@v7
        env:
          COUPON_OUTPUT: ${{ runner.temp }}/public-coupons.json
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const branch = 'coupon-data';
            const path = 'public-coupons.json';
            try {
              await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: context.sha});
            }
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              sha = existing.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner, repo, branch, path, sha,
              message: 'Refresh verified public coupon snapshot',
              content: fs.readFileSync(process.env.COUPON_OUTPUT).toString('base64')});
