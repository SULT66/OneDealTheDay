name: Verify public coupons
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy OneDailyDrop to Azure"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: public-coupon-refresh
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Refresh coupons through the production app
        env:
          ADMIN_KEY: ${{ secrets.ONEDEAL_ADMIN_KEY }}
        run: |
          node <<'JS'
          (async()=>{
            if(!process.env.ADMIN_KEY) throw new Error('ONEDEAL_ADMIN_KEY is missing');
            const response=await fetch('https://www.onedailydrop.com/api/admin/coupons/refresh',{
              method:'POST',headers:{'X-Admin-Key':process.env.ADMIN_KEY},signal:AbortSignal.timeout(150000)});
            if(!response.ok) throw new Error('Coupon refresh endpoint returned HTTP '+response.status);
            const result=await response.json();
            console.log(JSON.stringify(result,null,2));
            const sources=Object.values(result.sources || {});
            if(!sources.some(source=>source.status==='success' || source.status==='partial' && source.failedSources < source.checkedSources)) {
              throw new Error('No coupon source could be checked. See per-source status above.');
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          JS
