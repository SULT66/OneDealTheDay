name: Verify production release

# After the deploy, never alongside it.
#
# Both workflows used to trigger on the same push, so this one started polling
# for a release that had not been uploaded yet. The deploy alone took 4m21s,
# leaving Azure the rest of a ten minute retry budget to restart and warm up,
# and on 2026-09-01 it did not make it: the run failed at 11m51s against a
# site that was healthy minutes later. Waiting for the deploy to finish gives
# the whole budget to the thing actually being waited for.
on:
  workflow_run:
    workflows: ["Deploy OneDailyDrop to Azure"]
    types: [completed]
  workflow_dispatch:

# The deploy workflow cancels an in-flight deploy when a newer push lands
# (see deploy-azure.yml), so a verify run for the cancelled commit would wait
# out its full retry budget for a release that will never go live. Its own
# group (not shared with the deploy) drops that stale run in favor of the
# verify for whichever commit actually deployed.
concurrency:
  group: onedailydrop-verify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-production:
    # A deploy that failed or was cancelled has no release to verify, and
    # failing here as well would report one problem twice.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Comfortably past the retry budget below, so the step always ends on
    # its own terms and says why, rather than being killed mid-attempt.
    timeout-minutes: 20
    steps:
      - name: Check out the expected release
        uses: actions/checkout@v4
        with:
          # The commit the deploy actually shipped. Under workflow_run the
          # default checkout is whatever main points at now, which is a
          # different commit the moment two merges land close together.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait for Azure and verify the live site
        shell: bash
        env:
          EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The deploy stamps the commit it shipped; compare against that
          # rather than a constant in the repository, which would match no
          # matter which package Azure ended up serving.
          expected_release="${EXPECTED_RELEASE}"
          # The same rule as the release id, and for the same reason: compare
          # the live site against the code this deploy shipped, never against a
          # literal written here. A hardcoded "catalog-taxonomy-v3" turned a
          # deliberate bump to v4 — which is how a taxonomy fix reaches
          # listings already stored — into ten minutes of polling and a red
          # build, on a site that was serving the new release correctly all
          # along.
          expected_taxonomy="$(node -e 'process.stdout.write(require("./src/catalogTaxonomy").TAXONOMY_VERSION)')"
          echo "Expecting release ${expected_release} with taxonomy ${expected_taxonomy}."
          # Stop retrying by the clock, not by a count of attempts.
          #
          # Thirty attempts sleeping twenty seconds was written as a ten
          # minute budget, and it is only that when every request answers at
          # once. Each attempt also makes up to six calls worth 200 seconds of
          # curl timeouts, so a slow warm-up pushes the loop past the fifteen
          # minute job timeout and the runner kills the step before it can
          # print anything. That is what happened on release 64ca6d0: the run
          # ended at 15m10s with no message, on a site that was serving the
          # expected commit and passing every check in this file.
          #
          # A deadline keeps the promise the comment above already makes: ten
          # minutes of waiting, then this step says so itself, in time for
          # anyone to read it.
          # Fifteen minutes, not ten.
          #
          # Ten was chosen when a cold start took four or five. Since then the
          # cache warmer and a heavier first render have pushed Azure to the
          # edge of the budget: runs 156, 157 and 158 took 10m31s, 10m01s and
          # then failed at 10m08s, on a site that answered in under a second
          # once it settled. Failing a healthy deploy is worse than waiting.
          deadline=$(( SECONDS + 900 ))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$(( attempt + 1 ))
            status_payload="$(curl --fail --silent --show-error --max-time 20 'https://www.onedailydrop.com/api/status?market=us' || true)"
            if jq -e --arg release "${expected_release}" --arg taxonomy "${expected_taxonomy}" '
              .releaseId == $release and
              .taxonomyVersion == $taxonomy and
              .market == "us" and
              .liveProducts > 0
            ' <<<"${status_payload}" >/dev/null 2>&1; then
              homepage_payload="$(curl --fail --silent --show-error --max-time 20 \
                'https://www.onedailydrop.com/us' || true)"
              # The homepage leads with the catalog now: the daily drop moved to
              # /us/daily-drop, so "Today's #1 pick" is deliberately gone and is
              # no longer something to assert on.
              if grep -q 'OneDailyDrop' <<<"${homepage_payload}" && \
                 grep -q 'Best right now' <<<"${homepage_payload}" && \
                 grep -q 'href="/us/daily-drop"' <<<"${homepage_payload}" && \
                 grep -q 'href="/us/deal/' <<<"${homepage_payload}" && \
                 grep -q 'href="/us/search"' <<<"${homepage_payload}"; then
                results_payload="$(curl --fail --silent --show-error --max-time 40 \
                  'https://www.onedailydrop.com/us/search?q=desk' || true)"
                if grep -q 'deal.*match\|Nothing matches those filters' <<<"${results_payload}"; then
                  compact_catalog="$(curl --fail --silent --show-error --max-time 40 \
                    'https://www.onedailydrop.com/api/products?market=us&limit=1&compact=1' || true)"
                  product_path="$(jq -r '.[0].deal_url // empty' <<<"${compact_catalog}" 2>/dev/null)"
                  # The Next.js frontend routes on the numeric id, not the SEO
                  # slug the API returns, so re-derive /us/deal/<id> from it.
                  product_id="$(grep -oE '[0-9]+$' <<<"${product_path}" || true)"
                  if [[ -n "${product_id}" ]]; then
                    product_payload="$(curl --fail --silent --show-error --max-time 40 \
                      "https://www.onedailydrop.com/us/deal/${product_id}" || true)"
                    drop_payload="$(curl --fail --silent --show-error --max-time 40 \
                      'https://www.onedailydrop.com/us/daily-drop' || true)"
                    if grep -q 'Why it made the list\|Why we picked it' <<<"${product_payload}" && \
                       grep -q 'View deal at' <<<"${product_payload}" && \
                       grep -q "Today&#x27;s pick\|Today's pick" <<<"${drop_payload}"; then
                      echo "Azure is serving the expected commit with a real catalog, the Next.js homepage, search, deal and daily-drop pages."
                      jq '{releaseId,taxonomyVersion,market,liveProducts,provider}' <<<"${status_payload}"
                      exit 0
                    fi
                  fi
                fi
              fi
            fi
            echo "Attempt ${attempt}: Azure has not switched to the expected release yet ($(( deadline - SECONDS ))s left)."
            # Out of time: stop, rather than starting an attempt that cannot
            # finish. Skipping only the sleep instead turns the last seconds
            # of the budget into a tight loop hammering the site — a local
            # run of this script managed 38 attempts in 14 seconds that way.
            # Written as an if rather than `(( ... )) && sleep`, because
            # GitHub runs this step under set -e and a false arithmetic test
            # as the final command would end the step, not the iteration.
            if (( SECONDS + 20 >= deadline )); then
              break
            fi
            sleep 20
          done

          echo "Azure did not serve the expected release within 15 minutes."
          exit 1
