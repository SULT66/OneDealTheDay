name: Verify production release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the expected release
        uses: actions/checkout@v4

      - name: Wait for Azure and verify the live catalog
        shell: bash
        run: |
          expected_release="$(node -p "require('./src/release').RELEASE_ID")"
          for attempt in {1..30}; do
            status_payload="$(curl --fail --silent --show-error --max-time 20 'https://www.onedailydrop.com/api/status?market=us' || true)"
            if jq -e --arg release "${expected_release}" '
              .releaseId == $release and
              .taxonomyVersion == "catalog-taxonomy-v1" and
              .market == "us" and
              .liveProducts > 0
            ' <<<"${status_payload}" >/dev/null 2>&1; then
              search_payload="$(curl --fail --silent --show-error --max-time 20 \
                'https://www.onedailydrop.com/api/search?market=us&sort=best_match&page=1&limit=1' || true)"
              if jq -e '
                .ranking_model == "ranking-v1" and
                .market == "us" and
                .sort == "best_match" and
                .pagination.total > 0 and
                (.products | length) == 1
              ' <<<"${search_payload}" >/dev/null 2>&1; then
                echo "Azure is serving the expected OneDailyDrop release and Search API."
                jq '{releaseId,taxonomyVersion,market,liveProducts,provider}' <<<"${status_payload}"
                jq '{ranking_model,sort,pagination,returned:(.products | length)}' <<<"${search_payload}"
                exit 0
              fi
            fi
            echo "Attempt ${attempt}/30: Azure has not switched to the expected release yet."
            sleep 20
          done

          echo "Azure did not serve the expected release within 10 minutes."
          exit 1
