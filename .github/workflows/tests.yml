name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the previous run instead of
# queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Count tracked application code lines
        run: node scripts/count-code-lines.js

      - name: Install dependencies
        run: npm ci

      # Must run before the test suite, exactly as in deploy-azure.yml:
      # scripts/test-analytics-baseline.js boots the app in production mode,
      # and Next.js in production mode requires this build to already exist.
      - name: Build Next.js frontend
        run: npm run build:frontend

      - name: Run the test suite
        run: npm test

      - name: Test ODD Live AI and producer leases
        run: node --test tests/oddLiveBrain.test.js tests/oddLiveProducer.test.js tests/oddTvChannel.test.js scripts/test-odd-live-queue.js tests/oddTvChannel.test.js

      - name: Check ODD Live GPU worker Python syntax
        run: python -m py_compile gpu-worker/odd_live_chloe_worker.py gpu-worker/odd_live_program.py
