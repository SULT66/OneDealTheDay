name: Deploy OneDailyDrop to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment trigger: regional navigation release 2026-07-28
#
# Deploys queue, they do not interrupt each other. Cancelling here only stops
# the GitHub job: Azure carries on with whatever upload was already in flight,
# and the next run then collides with a release the platform still considers
# in progress. That is what happened when two pull requests were merged a
# couple of minutes apart -- the first deploy was cancelled part-way through
# and the second failed outright at the Azure step, leaving production on the
# older build even though every test had passed.
#
# The cost is that back-to-back merges deploy one after the other instead of
# only the last one. For a production release that is the right trade.
concurrency:
  group: onedealtheday-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before the test suite: scripts/test-analytics-baseline.js
      # boots the app in production mode (it sets WEBSITE_SITE_NAME itself to
      # exercise that path), and Next.js in production mode requires this
      # build to already exist.
      - name: Build Next.js frontend
        run: npm run build:frontend

      - name: Validate production build
        run: npm test

      # Stamped into the package so /api/status reports the commit actually
      # running, and the verification below can tell a real swap from a deploy
      # that reported success while leaving the previous package active.
      - name: Stamp the release
        run: echo "${GITHUB_SHA}" > .release-sha

      # Trace the custom server and ship only files it can load in production.
      # In particular, do not send the Turbopack cache, test suite, repository
      # history, unused packages or devDependencies.
      # The .deployment file tells App Service not to run Oryx a second time;
      # that redundant build created node_modules.tar.gz and left the site on
      # 503 while every cold start tried to extract more than 500 MB.
      - name: Prepare lean production package
        run: |
          release_dir="${RUNNER_TEMP}/onedailydrop-release"
          node scripts/build-runtime-package.js "${release_dir}"

          test ! -e "${release_dir}/.next/cache"
          test ! -e "${release_dir}/scripts"
          test ! -e "${release_dir}/node_modules.tar.gz"
          test ! -e "${release_dir}/oryx-manifest.toml"
          du -sh "${release_dir}"

      # v3/OneDeploy can report success while leaving the previous Linux App
      # Service package active. v2 uses the stable zip-deploy path here.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: onedealtheday
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/onedailydrop-release

      - name: Verify production health
        id: verify-health
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 20 \
            "https://onedealtheday-g3dme0aghzerc3a2.centralus-01.azurewebsites.net/api/status" \
            > /dev/null

      - name: Collect Azure startup logs after failed health check
        if: steps.verify-health.outcome == 'failure'
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: node scripts/fetch-azure-startup-logs.js

      - name: Fail an unhealthy production release
        if: steps.verify-health.outcome == 'failure'
        run: exit 1
